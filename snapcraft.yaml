name: pc
adopt-info: pc
version: '24.04-1'
type: gadget
base: core22
summary: Classic PC gadget for generic amd64 devices
description: |
    This gadget enables booting generic PC amd64 with classic Ubuntu
confinement: strict
grade: stable

parts:
  grub-prepare:
    plugin: nil
    stage-packages:
      - grub-efi-amd64-signed
      - grub-pc-bin
      - shim-signed
    prime: [ -* ]

  grub:
    source: .
    build-packages:
      - grub-common
    plugin: make
    after: [grub-prepare]
